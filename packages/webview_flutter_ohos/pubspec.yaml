name: webview_flutter_ohos
description: OpenHarmony implementation of the webview_flutter plugin.
repository: https://gitcode.com/openharmony-tpc/flutter_packages/tree/master/packages/webview_flutter/webview_flutter_ohos
issue_tracker: https://gitcode.com/openharmony-tpc/flutter_packages/issues
version: 3.15.0

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.7.0"

flutter:
  plugin:
    implements: webview_flutter
    platforms:
      ohos:
        package: io.flutter.plugins.webviewflutter
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: OhosWebViewPlatform

dependencies:
  flutter:
    sdk: flutter
  webview_flutter_platform_interface: ^2.10.0

dev_dependencies:
  build_runner: ^2.1.4
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  pigeon: ^9.2.4
  plugin_platform_interface: ^2.1.8
  webview_flutter: 4.6.0
